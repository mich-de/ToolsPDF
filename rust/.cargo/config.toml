# Non richiede MSVC: serve llvm-mingw (clang) nel PATH.
[build]
target = "x86_64-pc-windows-gnullvm"

[target.x86_64-pc-windows-gnullvm]
linker = "x86_64-w64-mingw32-clang"
# Tutto statico: l'exe deve restare un solo file portable.
# Se si cambiano, aggiornare anche $flags in release.ps1 (che toglie i percorsi del PC dall'exe).
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-static"]
